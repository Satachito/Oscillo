name: Deploy PiLyzer Web
on:
  push:
    branches: [main]
    paths: ['Pico2/Web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build
        working-directory: Pico2/Web
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Pico2/Web/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
